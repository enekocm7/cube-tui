[package]
name = "cube-tui"
version = "0.1.15"
edition = "2024"
repository = "https://github.com/enekocm7/cube-tui"
readme = "README.md"
description = "Terminal UI timer and session manager for speedcubing, with optional web dashboard and BLE (GAN) timer support."
license = "MIT"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"

[features]
dashboard = ["axum", "rust-embed", "mime_guess"]
bluetooth = ["uuid", "btleplug", "futures-util"]
wca-scrambles = ["jni"]

[[bin]]
name = "cube"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", optional = true }
btleplug = { version = "0.12.0", optional = true }
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive", "color"] }
cube-tui-macros = { path = "macros", version = "0.1.0" }
dirs = "6.0.0"
futures-util = { version = "0.3.33", optional = true }
flume = { version = "0.12.0", features = ["async"] }
jni = { version = "0.22.4", features = ["invocation"], optional = true }
mime_guess = { version = "2.0.5", optional = true }
open = { version = "5.4.1" }
rand = "0.10.2"
ratatui = "0.30.2"
rust-embed = { version = "8.12.0", optional = true, features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
toml = "1.1.4"
uuid = { version = "1.24.0", optional = true, features = ["v4"] }

[dev-dependencies]
rstest = "0.26.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
