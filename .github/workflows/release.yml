name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.os }} executable
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: cube-linux-x86_64
            binary_name: cube
            release_file_name: cube-${{ github.ref_name }}-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: cube-linux-aarch64
            binary_name: cube
            release_file_name: cube-${{ github.ref_name }}-linux-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: cube-macos-x86_64
            binary_name: cube
            release_file_name: cube-${{ github.ref_name }}-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: cube-macos-aarch64
            binary_name: cube
            release_file_name: cube-${{ github.ref_name }}-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: cube-windows-x86_64
            binary_name: cube.exe
            release_file_name: cube-${{ github.ref_name }}-windows-x86_64.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact_name: cube-windows-aarch64
            binary_name: cube.exe
            release_file_name: cube-${{ github.ref_name }}-windows-aarch64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config libasound2-dev

      - name: Install system dependencies (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libdbus-1-dev:arm64 pkg-config libasound2-dev:arm64

      - name: Configure Linux ARM64 cross-compilation
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> "$GITHUB_ENV"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Build release executable
        run: cargo build --release --all-features --locked --target ${{ matrix.target }}

      - name: Prepare executable (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/${{ matrix.release_file_name }}

      - name: Prepare executable (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/${{ matrix.release_file_name }}

      - name: Upload executable artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.release_file_name }}

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/cube-${{ github.ref_name }}-linux-x86_64
            artifacts/**/cube-${{ github.ref_name }}-linux-aarch64
            artifacts/**/cube-${{ github.ref_name }}-macos-x86_64
            artifacts/**/cube-${{ github.ref_name }}-macos-aarch64
            artifacts/**/cube-${{ github.ref_name }}-windows-x86_64.exe
            artifacts/**/cube-${{ github.ref_name }}-windows-aarch64.exe
          generate_release_notes: true
