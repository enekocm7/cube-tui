[tools]
bun = '1.4.2'
python = "latest"

[tasks.run]
description = "Run the app without features"
run = "cargo run"
alias = "r"

[tasks.dashboard]
description = "Run the dashboard"
run = "cargo run --features dashboard -- dashboard"
alias = "dash"

[tasks.build]
description = "Build the app without features"
run = "cargo build"
alias = "b"

[tasks.bluetooth]
description = "Run the app with Bluetooth support"
run = "cargo run --features bluetooth"
alias = "bt"

[tasks.build-all]
description = "Build the app with all features"
run = "cargo build --all-features"
alias = "ba"

[tasks.run-all]
description = "Run the app with all features"
run = "cargo run --all-features"
alias = "ra"

[tasks.test]
description = "Run tests without features"
run = "cargo test"
alias = "t"

[tasks.test-all]
description = "Run tests with all features"
run = "cargo test --workspace --all-features"
alias = "ta"

[tasks.test-scrambles]
description = "Run Rust scramble tests"
run = "cargo test --features wca-scrambles"
alias = "ts"

[tasks.test-tnoodle]
description = "Test the TNoodle Rust port against the recorded Java fixtures"
run = "cargo test -p tnoodle-rs"
alias = "tt"

[tasks.release]
description = "Bump version, tag, publish and push to trigger the release build"
alias = "rel"
usage = '''
arg "<bump>" help="major | minor | patch | explicit version (e.g. 1.2.3)"
flag "--dry-run" help="show steps without doing them"
'''
run = '''
#!/usr/bin/env bash
BUMP="${usage_bump?}"
DRY_RUN="${usage_dry_run:-false}"
if [ "$DRY_RUN" = "true" ]; then
  python scripts/release.py "$BUMP" --dry-run
else
  python scripts/release.py "$BUMP"
fi
'''

[tasks.test-all-scrambles]
description = "Run the TNoodle port and app scramble tests"
run = [
    { task = "test-tnoodle" },
    { task = "test-scrambles" }
]
alias = "tas"
