[tasks.run]
description = "Run the app without features"
run = "cargo run"
alias = "r"

[tasks.dashboard]
description = "Run the dashboard"
run = "cargo run --features dashboard -- dashboard"
alias = "dash"

[tasks.build]
description = "Build the app without features"
run = "cargo build"
alias = "b"

[tasks.bluetooth]
description = "Run the app with Bluetooth support"
run = "cargo run --features bluetooth"
alias = "bt"

[tasks.build-all]
description = "Build the app with all features"
run = "cargo build --all-features"
alias = "ba"

[tasks.run-all]
description = "Run the app with all features"
run = "cargo run --all-features"
alias = "ra"

[tasks.test]
description = "Run tests without features"
run = "cargo test"
alias = "t"

[tasks.test-all]
description = "Run tests with all features"
run = "cargo test --all-features"
alias = "ta"

[tasks.test-java]
description = "Test the scrambles Java code"
dir = "scrambles"
run = "./gradlew :lib:test --no-daemon"
run_windows = "gradlew.bat :lib:test --no-daemon"
alias = "tj"

[tasks.test-scrambles]
description = "Run Rust and scrambles Java tests"
run = [
    "mise run test-java",
    "cargo test --features wca-scrambles"
]
alias = "ts"
